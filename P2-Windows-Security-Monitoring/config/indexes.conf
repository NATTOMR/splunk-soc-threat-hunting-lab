# ==============================================================================
# File: config/indexes.conf
# Project: P2 — Windows Security Monitoring with Splunk
# Target Location: /opt/splunk/etc/system/local/indexes.conf (on Ubuntu Splunk Enterprise)
# Description: Index specifications for Windows security telemetry and Sysmon events.
#              Configured with dedicated storage paths and sizing policies.
# ==============================================================================

# ------------------------------------------------------------------------------
# Windows Events Index
# Stores: WinEventLog:Security, WinEventLog:System, WinEventLog:Application
# ------------------------------------------------------------------------------
[windows]
homePath   = $SPLUNK_DB/windows/db
coldPath   = $SPLUNK_DB/windows/colddb
thawedPath = $SPLUNK_DB/windows/thaweddb
maxTotalDataSizeMB = 10240
maxDataSize = auto_high_volume

# ------------------------------------------------------------------------------
# Sysmon Events Index
# Stores: Microsoft-Windows-Sysmon/Operational events (Process, Network, File, Registry)
# ------------------------------------------------------------------------------
[sysmon]
homePath   = $SPLUNK_DB/sysmon/db
coldPath   = $SPLUNK_DB/sysmon/colddb
thawedPath = $SPLUNK_DB/sysmon/thaweddb
maxTotalDataSizeMB = 10240
maxDataSize = auto_high_volume
