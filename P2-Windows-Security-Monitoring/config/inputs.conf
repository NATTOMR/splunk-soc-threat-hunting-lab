# ==============================================================================
# File: config/inputs.conf
# Project: P2 — Windows Security Monitoring with Splunk
# Target Location: C:\Program Files\SplunkUniversalForwarder\etc\system\local\inputs.conf
# Description: Production inputs configuration for Splunk Universal Forwarder on Windows 11.
#              Collects core Windows Event Channels and Microsoft-Windows-Sysmon/Operational.
# Security Note: renderXml = true provides structured XML event rendering for accurate field extraction.
# ==============================================================================

[default]
# Hostname default uses endpoint machine name ($COMPUTERNAME)

# ------------------------------------------------------------------------------
# Windows Security Event Log
# Captures: Account logons (4624/4625), privilege escalation (4672), account management
#           (4720/4726), and process creation auditing (4688 with CLI arguments).
# ------------------------------------------------------------------------------
[WinEventLog://Security]
disabled = 0
index = windows
renderXml = true

# ------------------------------------------------------------------------------
# Windows System Event Log
# Captures: Service installations (7045), driver loadings, system reboots, and kernel events.
# ------------------------------------------------------------------------------
[WinEventLog://System]
disabled = 0
index = windows
renderXml = true

# ------------------------------------------------------------------------------
# Windows Application Event Log
# Captures: Application errors, crash events, installer logging, and third-party software alerts.
# ------------------------------------------------------------------------------
[WinEventLog://Application]
disabled = 0
index = windows
renderXml = true

# ------------------------------------------------------------------------------
# Microsoft Windows Sysmon Operational Log
# Captures: Detailed process creation (Event 1), process tampering (Event 25), network
#           connections (Event 3), driver loads (Event 6), remote threads (Event 8),
#           raw disk access (Event 9), process access (Event 10), and file creation (Event 11).
# ------------------------------------------------------------------------------
[WinEventLog://Microsoft-Windows-Sysmon/Operational]
disabled = 0
index = sysmon
renderXml = true
